<div id="battery-power-view">
  <h3>电池充放电功率 · 随机四日</h3>
  <div class="viz-row" data-legend></div>
  <div data-plots></div>
  <style>
    #battery-power-view .battery-axis text { fill:var(--foreground); font-size:12px; }
    #battery-power-view .battery-axis path, #battery-power-view .battery-axis line { stroke:var(--border); }
    #battery-power-view svg text { fill:var(--foreground); font-size:12px; }
    #battery-power-view [data-legend] button { color:var(--foreground); background:transparent; border:0; cursor:pointer; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script type="application/json" data-evidence>__BATTERY_EVIDENCE__</script>
  <script>
    (() => {
      const root=document.getElementById('battery-power-view');
      const source=root.querySelector('[data-evidence]').textContent;
      if(source.trim().startsWith('__')) { root.querySelector('[data-plots]').textContent='尚未绑定实测电池功率数据'; return; }
      const data=JSON.parse(source), visible=new Set(data.series.map(s=>s.key));
      const colors=['var(--viz-series-1)','var(--viz-series-2)'];
      data.series.forEach((s,i)=>{
        const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-pressed','true');
        b.textContent=(i===0?'┄ ':'━ ')+s.label;
        b.style.textDecorationColor=colors[i];
        b.onclick=()=>{if(visible.has(s.key))visible.delete(s.key);else visible.add(s.key);b.setAttribute('aria-pressed',String(visible.has(s.key)));draw();};
        root.querySelector('[data-legend]').append(b);
      });
      const panels=data.days.map(day=>{
        const panel=document.createElement('div'), title=document.createElement('p');title.textContent=day.date;
        const svg=d3.create('svg').attr('role','img').attr('aria-label',day.date+'，充电为正、放电为负，净功率kW');
        panel.append(title,svg.node());root.querySelector('[data-plots]').append(panel);
        return {panel,svg,day};
      });
      function draw(){
        panels.forEach(({panel,svg,day})=>{
          const w=panel.getBoundingClientRect().width,h=218,l=70,r=w-16,t=12,b=165;
          svg.attr('width','100%').attr('height',h).attr('viewBox',`0 0 ${w} ${h}`);svg.selectAll('*').remove();
          const x=d3.scaleLinear().domain([0,24]).range([l+2,r-2]);
          const extent=d3.extent(data.days.flatMap(day=>data.series.flatMap(s=>day.values[s.key])));
          const bound=Math.max(5000,...extent.map(Math.abs))*1.08;
          const y=d3.scaleLinear().domain([-bound,bound]).range([b-2,t+2]);
          svg.append('rect').attr('data-chart-frame','').attr('x',l).attr('y',t).attr('width',r-l).attr('height',b-t).attr('fill','none').attr('stroke','var(--border)');
          svg.append('line').attr('x1',l).attr('x2',r).attr('y1',y(0)).attr('y2',y(0)).attr('stroke','var(--border)');
          svg.append('g').attr('class','battery-axis').attr('transform',`translate(0,${b})`).call(d3.axisBottom(x).tickValues(w<420?[0,8,16,24]:[0,4,8,12,16,20,24]).tickFormat(v=>String(v).padStart(2,'0')+':00'));
          svg.append('g').attr('class','battery-axis').attr('transform',`translate(${l},0)`).call(d3.axisLeft(y).tickValues([-5000,0,5000]));
          svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(l+r)/2).attr('y',208).attr('text-anchor','middle').text('区间终点时刻 / 时');
          svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(14,${(t+b)/2}) rotate(-90)`).attr('text-anchor','middle').text('净充电功率 / kW');
          data.series.forEach((s,i)=>{
            if(!visible.has(s.key))return;
            svg.append('path').datum(day.values[s.key]).attr('d',d3.line().x((v,j)=>x((j+1)/6)).y(v=>y(v))).attr('fill','none').attr('stroke',colors[i]).attr('stroke-width',1.5).attr('stroke-dasharray',i===0?'4 3':null);
          });
          const labels=svg.selectAll('.tick text').nodes();
          labels.forEach(el=>{const rect=el.getBoundingClientRect();const box=svg.node().getBoundingClientRect();if(rect.right>box.right-4)el.setAttribute('text-anchor','end');if(rect.left<box.left+4)el.setAttribute('text-anchor','start');});
          // Measure both title and tick bounds after layout; labels have dedicated axis margins.
          svg.selectAll('text').nodes().forEach(el=>el.getBoundingClientRect());
        });
      }
      new ResizeObserver(draw).observe(root);draw();
    })();
  </script>
</div>
