<div id="q2-discussion-overview">
  <h3>第二问：已知数据与实际购电费用</h3>
  <div class="q2-overview-caption text-small"></div>
  <section><h3>每月负载与光伏电量</h3><div class="q2-overview-legend"></div><div class="q2-overview-monthly"></div></section>
  <section><h3>每天重复使用的电价</h3><div class="q2-overview-tariff"></div></section>
  <section><h3>2—12月总购电费：计划费＋紧急购电费</h3><div class="q2-overview-cost"></div></section>
  <script type="application/json" class="q2-overview-data">@@DATA@@</script>
</div>
<style>
#q2-discussion-overview section{margin-top:20px}
#q2-discussion-overview .q2-overview-chart{display:block;width:100%}
#q2-discussion-overview .q2-overview-chart text{fill:var(--foreground);font-size:12px}
#q2-discussion-overview .q2-overview-chart .domain,#q2-discussion-overview .q2-overview-chart .tick line{stroke:var(--border)}
#q2-discussion-overview .q2-overview-legend{display:flex;flex-wrap:wrap;gap:18px}
#q2-discussion-overview .q2-overview-legend button{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;padding:4px 0;color:var(--foreground);font:inherit;cursor:pointer}
#q2-discussion-overview .q2-overview-legend .swatch{width:12px;height:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root=document.getElementById('q2-discussion-overview');
  const data=JSON.parse(root.querySelector('.q2-overview-data').textContent);
  root.querySelector('.q2-overview-caption').textContent=data.scope;
  const colors=['var(--viz-series-1)','var(--viz-series-2)'];
  const series=[{key:'load_kwh',label:'负载',color:colors[0]},{key:'pv_kwh',label:'光伏',color:colors[1]}];
  const visible=new Set(series.map(s=>s.key));
  const number=(v,d=2)=>v.toLocaleString('zh-CN',{maximumFractionDigits:d});
  let drawAll=()=>{};
  for(const seriesItem of series){
    const button=document.createElement('button');button.type='button';button.setAttribute('aria-pressed','true');
    const swatch=document.createElement('span');swatch.className='swatch';swatch.style.background=seriesItem.color;
    button.append(swatch,document.createTextNode(seriesItem.label));
    button.addEventListener('click',()=>{visible.has(seriesItem.key)?visible.delete(seriesItem.key):visible.add(seriesItem.key);button.setAttribute('aria-pressed',String(visible.has(seriesItem.key)));drawAll();});
    root.querySelector('.q2-overview-legend').append(button);
  }
  function canvas(selector,height,label){
    const host=root.querySelector(selector),width=host.getBoundingClientRect().width;
    if(width<1)return null;
    const svg=d3.select(host).selectAll('svg').data([0]).join('svg').attr('class','q2-overview-chart')
      .attr('viewBox',`0 0 ${width} ${height}`).attr('height',height).attr('role','img').attr('aria-label',label);
    svg.selectAll('*').remove();return {svg,width,height};
  }
  function frame(svg,x,y,width,height){svg.append('rect').attr('data-chart-frame','').attr('x',x).attr('y',y).attr('width',width).attr('height',height).attr('fill','none').attr('stroke','var(--border)');}
  function titles(svg,width,height,left,xTitle,yTitle){
    svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('x',left).attr('y',14).text(yTitle);
    svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(left+width-14)/2).attr('y',height-5).attr('text-anchor','middle').text(xTitle);
  }
  function fitLabels(svg,left,right){
    const text=[...svg.node().querySelectorAll('text')];
    for(const label of text){const box=label.getBBox();
      if(label.classList.contains('q2-cost-value')&&box.x+box.width>right){label.setAttribute('x',right-4);label.setAttribute('text-anchor','end');}
    }
    let previous=null;
    for(const label of svg.selectAll('.x-axis .tick text').nodes()){
      const box=label.getBoundingClientRect();if(previous&&box.left<previous.right+4)label.textContent='';else previous=box;
    }
  }
  function monthly(){
    const out=canvas('.q2-overview-monthly',260,'2025年1至12月负载与光伏电量，单位万kWh；来自附件2实测功率，每个十分钟区间除以6后相加。');if(!out)return;
    const {svg,width,height}=out,left=64,right=14,top=28,bottom=48;
    const domain=d3.extent([0,...data.monthly.flatMap(r=>series.map(s=>r[s.key]/10000))]);
    const y=d3.scaleLinear().domain([0,domain[1]*1.09]).range([height-bottom-4,top+4]);
    const x=d3.scaleBand().domain(data.monthly.map(r=>r.month)).range([left+4,width-right-4]).padding(.22);
    frame(svg,left,top,width-left-right,height-top-bottom);
    svg.append('g').attr('transform',`translate(${left},0)`).call(d3.axisLeft(y).ticks(4));
    const labels=width<480?[1,4,7,10]:data.monthly.map(r=>r.month);
    svg.append('g').attr('class','x-axis').attr('transform',`translate(0,${height-bottom})`).call(d3.axisBottom(x).tickValues(labels));
    const active=series.filter(s=>visible.has(s.key));
    for(const row of data.monthly){
      active.forEach((s,i)=>svg.append('rect').attr('x',x(row.month)+x.bandwidth()*i/active.length).attr('y',y(row[s.key]/10000))
        .attr('width',Math.max(1,x.bandwidth()/active.length-1)).attr('height',y(0)-y(row[s.key]/10000)).attr('fill',s.color));
      svg.append('rect').attr('data-chart-hit','').attr('x',x(row.month)-3).attr('y',top).attr('width',x.bandwidth()+6).attr('height',height-top-bottom)
        .attr('fill','transparent').attr('data-tooltip',`${row.month}月：${active.map(s=>s.label+' '+number(row[s.key])+' kWh').join('；')||'两条数据均已隐藏'}`);
    }
    titles(svg,width,height,left,'2025年月','电量（万kWh）');fitLabels(svg,left,width-right);
  }
  function tariff(){
    const out=canvas('.q2-overview-tariff',180,'附件1固定电价，横轴0到24小时，纵轴元每kWh。');if(!out)return;
    const {svg,width,height}=out,left=64,right=14,top=28,bottom=48;
    const values=[...data.price.map((price,i)=>({hour:i/6,price})),{hour:24,price:data.price.at(-1)}];
    const extent=d3.extent([0,...data.price]);
    const x=d3.scaleLinear().domain([0,24]).range([left+4,width-right-4]);
    const y=d3.scaleLinear().domain([0,extent[1]*1.1]).range([height-bottom-4,top+4]);
    frame(svg,left,top,width-left-right,height-top-bottom);
    svg.append('g').attr('transform',`translate(${left},0)`).call(d3.axisLeft(y).ticks(3));
    svg.append('g').attr('class','x-axis').attr('transform',`translate(0,${height-bottom})`).call(d3.axisBottom(x).tickValues([0,8,16,24]));
    svg.append('path').datum(values).attr('d',d3.line().x(d=>x(d.hour)).y(d=>y(d.price)).curve(d3.curveStepAfter))
      .attr('fill','none').attr('stroke',colors[0]).attr('stroke-width',2);
    const blocks=[];data.price.forEach((price,i)=>{const last=blocks.at(-1);if(last&&last.price===price)last.end=(i+1)/6;else blocks.push({start:i/6,end:(i+1)/6,price});});
    for(const block of blocks){svg.append('rect').attr('data-chart-hit','').attr('x',x(block.start)).attr('y',top).attr('width',Math.max(1,x(block.end)-x(block.start))).attr('height',height-top-bottom)
      .attr('fill','transparent').attr('data-tooltip',`${number(block.start)}—${number(block.end)}时：${number(block.price,4)}元/kWh；紧急购电 ${number(5*block.price,4)}元/kWh`);}
    titles(svg,width,height,left,'每天时刻（小时）','电价（元/kWh）');fitLabels(svg,left,width-right);
  }
  function costs(){
    const out=canvas('.q2-overview-cost',data.costs.length*62+84,'2025年2至12月各方案的总购电费用；计划电量全部付费，紧急电量另按五倍电价付费。');if(!out)return;
    const {svg,width,height}=out,left=112,right=14,top=24,bottom=46;
    const extent=d3.extent([0,...data.costs.map(r=>r.total_cost/10000)]);
    const x=d3.scaleLinear().domain([0,extent[1]*1.22]).range([left+4,width-right-4]);
    frame(svg,left,top,width-left-right,height-top-bottom);
    data.costs.forEach((row,i)=>{const y=top+62*i+22;
      svg.append('text').attr('x',left-8).attr('y',y+4).attr('text-anchor','end').text(row.label);
      svg.append('rect').attr('x',x(0)).attr('y',y-8).attr('height',16).attr('width',x(row.total_cost/10000)-x(0)).attr('fill',colors[0]);
      svg.append('text').attr('class','q2-cost-value').attr('x',x(row.total_cost/10000)+5).attr('y',y+4).text(number(row.total_cost/10000)+'万元');
      svg.append('rect').attr('data-chart-hit','').attr('x',left).attr('y',y-21).attr('width',width-left-right).attr('height',44).attr('fill','transparent')
        .attr('data-tooltip',`${row.label}：总费${number(row.total_cost,4)}元＝计划${number(row.planned_cost,4)}元＋紧急${number(row.emergency_cost,4)}元。${row.note||''}`);
    });
    svg.append('g').attr('class','x-axis').attr('transform',`translate(0,${height-bottom})`).call(d3.axisBottom(x).ticks(width<420?3:4));
    titles(svg,width,height,left,'总购电费用（万元）','方案');fitLabels(svg,left,width-right);
  }
  drawAll=()=>{monthly();tariff();costs();};
  const observer=new ResizeObserver(drawAll);observer.observe(root);drawAll();
})();
</script>
