[project]
name = "cumcm2026"
version = "0.1.0"
description = "CUMCM 2026 C: microgrid forecasting and control with TensorFlow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow==2.18.1",
    "tensorflow-metal==1.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tensorboard==2.18.0",
    "gymnasium[classic-control]>=1.2,<2",
    "numpy==2.0.2",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "pyyaml>=6,<7",
    "tqdm>=4.67,<5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30,<8",
    "jupyterlab>=4.4,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Keep the frozen, checkpoint-hashed training source byte-for-byte reproducible.
"experiments/common/neural_v1/train.py" = ["RUF100"]
# exp002 measured artifacts bind these source bytes. Retain harmless style/unused
# names; method caches are explicitly bounded (12 checkpoints / 128 donor days).
"experiments/common/neural_v2/evaluate.py" = ["I001", "F401", "RUF007"]
"experiments/common/neural_v2/predict.py" = ["I001", "F401", "B019"]
"experiments/common/neural_v2/risk.py" = ["I001", "RUF059"]
"experiments/common/neural_v2/scenarios.py" = ["B019", "RUF059"]
