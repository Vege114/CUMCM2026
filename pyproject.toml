[project]
name = "cumcm2026"
version = "0.1.0"
description = "CUMCM 2026 C: microgrid forecasting and control with TensorFlow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow>=2.21,<2.22",
    "tensorboard>=2.20,<3",
    "gymnasium[classic-control]>=1.2,<2",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "pyyaml>=6,<7",
    "tqdm>=4.67,<5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30,<8",
    "jupyterlab>=4.4,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"

[tool.ruff]
target-version = "py312"
line-length = 100
